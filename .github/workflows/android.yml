name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Controllo chiave di firma
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Mancano i secret KEYSTORE_BASE64 e KEYSTORE_PASSWORD (vedi LEGGIMI.md). Senza la stessa chiave l'APK non si aggiorna sopra la versione precedente."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/armadio.jks" || { echo "::error::KEYSTORE_BASE64 non valido: incolla di nuovo il valore dal file chiave-firma-SEGRETA.txt (solo la lunga riga di lettere, senza il titolo)."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/armadio.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null || { echo "::error::KEYSTORE_PASSWORD non corrisponde alla chiave: ricopialo dal file chiave-firma-SEGRETA.txt."; exit 1; }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/armadio.jks" >> "$GITHUB_ENV"

      - name: Dipendenze
        run: npm ci || npm install

      - name: Unisci index.html
        run: node tools/build.js

      - name: Progetto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#1f63f0' --iconBackgroundColorDark '#1f63f0' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          node tools/patch-android.js
          npx cap sync android

      - name: Compila APK firmato
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../IlTuoArmadio-1.0.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: IlTuoArmadio-*.apk

      - name: Pubblica nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Il tuo armadio 1.0.${{ github.run_number }}
          body: APK firmato. Installalo sopra la versione precedente.
          files: IlTuoArmadio-*.apk
